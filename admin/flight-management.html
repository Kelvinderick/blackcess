<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flight Management | Blackcess Admin</title>
  <link rel="stylesheet" href="admin.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <style>
    .panel { background:#111827; border-radius:18px; padding:20px; margin-bottom:20px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; }
    .form-field { display:grid; gap:6px; }
    .form-field input, .form-field select { padding:10px 12px; border-radius:10px; border:1px solid rgba(255,255,255,0.1); background:#1f2937; color:#fff; }
    .table-wrapper { overflow:auto; }
    .summary { color:#d4af37; font-size:0.9rem; margin-top:6px; }
    .pill { display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:6px 10px; background:#1f2937; color:#d4af37; font-size:0.78rem; }
  </style>
</head>
<body>
  <div class="sidebar">
    <h2>BLACKCESS</h2>
    <ul>
      <li onclick="location.href='admin.html'"><i class="fas fa-chart-line"></i> Dashboard</li>
      <li onclick="location.href='booking.html'"><i class="fas fa-ticket"></i> Bookings</li>
      <li onclick="location.href='user.html'"><i class="fas fa-users"></i> Users</li>
      <li class="active"><i class="fas fa-plane"></i> Flight Management</li>
    </ul>
  </div>

  <div class="main">
    <header>
      <h1>Flight management</h1>
      <button id="logoutBtn">Logout</button>
    </header>

    <section class="panel">
      <h2 style="margin-top:0;">Create or update a flight</h2>
      <form id="flight-form" class="grid">
        <div class="form-field">
          <label>Route</label>
          <input id="flight-route" required placeholder="LOS → LHR" />
        </div>
        <div class="form-field">
          <label>Flight number</label>
          <input id="flight-number" required placeholder="BC221" />
        </div>
        <div class="form-field">
          <label>Price (NGN)</label>
          <input id="flight-price" type="number" required min="10000" />
        </div>
        <div class="form-field">
          <label>Seats</label>
          <input id="flight-seats" type="number" required min="1" />
        </div>
        <div class="form-field">
          <label>Cabin</label>
          <select id="flight-cabin">
            <option value="Economy">Economy</option>
            <option value="Premium">Premium</option>
            <option value="Business">Business</option>
          </select>
        </div>
        <div class="form-field">
          <label>Status</label>
          <select id="flight-status">
            <option value="On Time">On Time</option>
            <option value="Delayed">Delayed</option>
            <option value="Boarding">Boarding</option>
          </select>
        </div>
        <div class="form-field" style="grid-column:1 / -1; display:flex; gap:10px; align-items:center;">
          <button type="submit" class="action-btn edit" style="background:#d4af37; color:#111827;">Save flight</button>
          <button type="button" id="cancel-edit" class="action-btn delete" style="display:none;">Cancel</button>
          <span class="summary" id="flight-summary">Use this view to add flights, update prices, and control available seats.</span>
        </div>
      </form>
    </section>

    <section class="panel">
      <h2 style="margin-top:0;">Managed flights</h2>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr><th>Route</th><th>Flight</th><th>Cabin</th><th>Price</th><th>Seats</th><th>Status</th><th>Actions</th></tr>
          </thead>
          <tbody id="flight-table-body"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script>
    const STORAGE_KEY = 'blackcess-admin-flights';
    let editingId = null;

    function loadFlights() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      } catch (_) {
        return [];
      }
    }

    function saveFlights(flights) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(flights));
    }

    function renderFlights() {
      const flights = loadFlights();
      const tbody = document.getElementById('flight-table-body');
      if (!flights.length) {
        tbody.innerHTML = '<tr><td colspan="7">No flights created yet.</td></tr>';
        return;
      }
      tbody.innerHTML = flights.map((flight) => `
        <tr>
          <td>${flight.route}</td>
          <td>${flight.number}</td>
          <td>${flight.cabin}</td>
          <td>₦${Number(flight.price).toLocaleString()}</td>
          <td>${flight.seats}</td>
          <td>${flight.status}</td>
          <td>
            <button class="action-btn edit" data-action="edit" data-id="${flight.id}">Edit</button>
            <button class="action-btn delete" data-action="delete" data-id="${flight.id}">Delete</button>
          </td>
        </tr>
      `).join('');
    }

    function resetForm() {
      document.getElementById('flight-form').reset();
      editingId = null;
      document.getElementById('cancel-edit').style.display = 'none';
      document.getElementById('flight-summary').textContent = 'Use this view to add flights, update prices, and control available seats.';
    }

    document.getElementById('flight-form').addEventListener('submit', (event) => {
      event.preventDefault();
      const flights = loadFlights();
      const payload = {
        id: editingId || `flight-${Date.now()}`,
        route: document.getElementById('flight-route').value.trim(),
        number: document.getElementById('flight-number').value.trim(),
        price: Number(document.getElementById('flight-price').value),
        seats: Number(document.getElementById('flight-seats').value),
        cabin: document.getElementById('flight-cabin').value,
        status: document.getElementById('flight-status').value
      };

      if (editingId) {
        const index = flights.findIndex((flight) => flight.id === editingId);
        if (index >= 0) flights[index] = payload;
      } else {
        flights.unshift(payload);
      }

      saveFlights(flights);
      renderFlights();
      resetForm();
    });

    document.getElementById('cancel-edit').addEventListener('click', resetForm);

    document.getElementById('flight-table-body').addEventListener('click', (event) => {
      const button = event.target.closest('button[data-action]');
      if (!button) return;
      const flights = loadFlights();
      const id = button.dataset.id;
      if (button.dataset.action === 'delete') {
        saveFlights(flights.filter((flight) => flight.id !== id));
        renderFlights();
        return;
      }

      const target = flights.find((flight) => flight.id === id);
      if (!target) return;
      editingId = target.id;
      document.getElementById('flight-route').value = target.route;
      document.getElementById('flight-number').value = target.number;
      document.getElementById('flight-price').value = target.price;
      document.getElementById('flight-seats').value = target.seats;
      document.getElementById('flight-cabin').value = target.cabin;
      document.getElementById('flight-status').value = target.status;
      document.getElementById('cancel-edit').style.display = 'inline-block';
      document.getElementById('flight-summary').textContent = `Editing ${target.number} · ${target.route}`;
    });

    renderFlights();
  </script>
</body>
</html>
