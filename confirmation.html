<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Booking Confirmed | Blackcess Airlines</title>
  <link rel="icon" type="image/png" href="./images/Untitled design.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root { --navy:#0f172a; --gold:#BA8B02; --text:#334155; --muted:#64748b; --border:#e2e8f0; }
    body { margin:0; font-family:Segoe UI, sans-serif; background:linear-gradient(135deg,#f8fafc,#eef2ff); color:var(--text); }
    .shell { max-width:960px; margin:0 auto; padding:40px 20px 80px; }
    .card { background:#fff; border:1px solid var(--border); border-radius:24px; padding:32px; box-shadow:0 18px 40px rgba(15,23,42,0.08); }
    .pill { display:inline-flex; align-items:center; gap:8px; background:#ecfdf3; color:#047857; border-radius:999px; padding:8px 14px; font-weight:700; }
    .meta { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin-top:24px; }
    .meta div { border:1px solid var(--border); border-radius:16px; padding:14px; background:#fbfdff; }
    .meta strong { display:block; color:var(--navy); margin-bottom:5px; }
    .actions { display:flex; flex-wrap:wrap; gap:12px; margin-top:24px; }
    .actions a, .actions button { text-decoration:none; border:none; border-radius:999px; padding:12px 16px; font-weight:700; cursor:pointer; }
    .primary { background:var(--gold); color:#fff; }
    .secondary { background:#f8fafc; color:var(--navy); border:1px solid var(--border); }
    .status-target { margin-top:18px; }
  </style>
</head>
<body>
  <div class="shell">
    <div class="card">
      <div class="pill"><i class="fas fa-circle-check"></i> Booking confirmed</div>
      <h1 style="margin:12px 0 8px; color:var(--navy);">Your trip is ready to go</h1>
      <p id="confirmation-message" style="margin:0; color:var(--muted); line-height:1.7;">We’re preparing your itinerary and confirmation email.</p>
      <div class="meta">
        <div><strong>Booking reference</strong><span id="pnr">—</span></div>
        <div><strong>Route</strong><span id="route">—</span></div>
        <div><strong>Departure</strong><span id="departure">—</span></div>
        <div><strong>Status</strong><span id="status">Confirmed</span></div>
      </div>
      <div class="actions">
        <a class="primary" href="my-bookings.html"><i class="fas fa-ticket"></i> View bookings</a>
        <a class="secondary" href="online_check.html"><i class="fas fa-clipboard-check"></i> Check in online</a>
        <a class="secondary" href="contact.html"><i class="fas fa-headset"></i> Contact support</a>
      </div>
      <div id="confirmation-status" class="status-target"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="auth-helper.js"></script>
  <script src="site-experience.js"></script>
  <script>
    const booking = JSON.parse(sessionStorage.getItem('blackcess-last-booking') || 'null');
    const params = new URLSearchParams(window.location.search);
    const pnr = params.get('pnr') || booking?.pnr || 'BC' + Math.floor(100000 + Math.random()*900000);
    const route = params.get('route') || booking?.route || 'Your selected itinerary';
    const departure = params.get('departure') || booking?.departure || 'As scheduled';
    const email = params.get('email') || booking?.email || (BlackcessDB.getCurrentProfile()?.email || '');

    document.getElementById('pnr').textContent = pnr;
    document.getElementById('route').textContent = route;
    document.getElementById('departure').textContent = departure;

    document.getElementById('confirmation-message').textContent = booking
      ? `Your booking has been recorded and your itinerary is ready. We have queued a confirmation notice to ${email || 'your inbox'}.`
      : 'We have stored your itinerary details. Please visit My Bookings at any time to manage it.';

    async function deliverConfirmation() {
      if (!email) return;
      try {
        const result = await BlackcessDB.sendEmail('booking-confirmation', {
          recipient: email,
          subject: 'Your Blackcess flight booking is confirmed',
          data: {
            pnr,
            route,
            departure
          }
        });
        if (result.ok && !result.skipped) {
          BlackcessUI.renderStatus('#confirmation-status', {
            type: 'success',
            title: 'Confirmation email queued',
            message: 'We have queued your itinerary confirmation notice.',
            detail: 'Check your inbox shortly for the latest travel details.'
          });
        }
      } catch (error) {
        BlackcessUI.renderStatus('#confirmation-status', {
          type: 'info',
          title: 'Travel details saved',
          message: 'Your itinerary is ready to view in My Bookings.',
          detail: 'Email delivery is currently preview-only in this build.'
        });
      }
    }

    deliverConfirmation();
  </script>
</body>
</html>
