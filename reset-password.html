<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | Blackcess Airlines</title>
<link rel="icon" type="image/png" href="./images/Untitled design.png">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
body {
  background: #0f172a;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.reset-card {
  background: #111827;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px;
  padding: 40px 34px;
  max-width: 400px;
  width: 100%;
}
.reset-card .logo-wrap {
  width: 100%;
  max-width: 200px;
  margin: 0 auto 20px auto;
  display: flex;
  justify-content: center;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
}
.reset-card .logo-wrap img {
  display: block;
  width: 140px;
  height: auto;
  object-fit: contain;
}
.reset-card h1 { color: #fff; font-size: 1.3rem; margin-bottom: 8px; text-align: center; }
.reset-card p.subtext { color: #94a3b8; font-size: 0.85rem; text-align: center; margin-bottom: 28px; line-height: 1.5; }

.form-group { margin-bottom: 18px; }
.form-group label { display: block; color: #cbd5e1; font-size: 0.82rem; margin-bottom: 7px; font-weight: 600; }
.input-wrapper { position: relative; }
.input-wrapper i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #94a3b8; }
.form-input {
  width: 100%;
  padding: 12px 14px 12px 40px;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.12);
  background: #1f2937;
  color: #fff;
  font-size: 0.92rem;
}
.form-input:focus { outline: none; border-color: #BA8B02; }

.reset-submit-btn {
  width: 100%;
  padding: 13px;
  border-radius: 8px;
  border: none;
  background: #BA8B02;
  color: #000;
  font-weight: 700;
  font-size: 0.92rem;
  cursor: pointer;
  margin-top: 8px;
}
.reset-submit-btn:hover { background: #d4a521; }
.reset-submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

.reset-msg { text-align: center; padding: 14px; border-radius: 8px; margin-bottom: 18px; font-size: 0.85rem; }
.reset-msg.error { background: rgba(220,38,38,0.12); color: #fca5a5; border: 1px solid rgba(220,38,38,0.3); }
.reset-msg.success { background: rgba(21,128,61,0.12); color: #86efac; border: 1px solid rgba(21,128,61,0.3); }

.back-to-login { text-align: center; margin-top: 20px; }
.back-to-login a { color: #BA8B02; font-size: 0.85rem; text-decoration: none; }
.back-to-login a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="reset-card">
  <div class="logo-wrap">
    <img src="./images/Untitled design.png" alt="Blackcess Royal Aviation Logo">
  </div>
  <h1 id="reset-title">Set a New Password</h1>
  <p class="subtext" id="reset-subtext">Choose a new password for your account below.</p>

  <div id="reset-msg-box"></div>

  <form id="reset-form">
    <div class="form-group">
      <label for="new-password">New Password</label>
      <div class="input-wrapper">
        <i class="fas fa-lock"></i>
        <input type="password" id="new-password" class="form-input" placeholder="At least 8 characters" required minlength="8">
      </div>
    </div>
    <div class="form-group">
      <label for="confirm-password">Confirm Password</label>
      <div class="input-wrapper">
        <i class="fas fa-lock"></i>
        <input type="password" id="confirm-password" class="form-input" placeholder="Re-enter your new password" required minlength="8">
      </div>
    </div>
    <button type="submit" class="reset-submit-btn" id="reset-submit-btn">Update Password</button>
  </form>

  <div class="back-to-login">
    <a href="login.html"><i class="fas fa-arrow-left"></i> Back to Login</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>
// When the person clicks the reset link in their email, Supabase redirects
// here with a recovery token in the URL and automatically starts a
// short-lived "recovery" session. We just need to confirm that session
// exists before letting them set a new password — if it doesn't (link
// expired, already used, or someone landed here directly), we show an
// error state instead of a broken form.
const form = document.getElementById("reset-form");
const msgBox = document.getElementById("reset-msg-box");
const submitBtn = document.getElementById("reset-submit-btn");

function showMsg(text, type) {
  msgBox.innerHTML = `<div class="reset-msg ${type}">${text}</div>`;
}

(async function checkRecoverySession() {
  const { data: { session } } = await window.supabase.auth.getSession();

  if (!session) {
    showMsg("This reset link is invalid or has expired. Request a new one from the login page.", "error");
    form.style.display = "none";
  }
})();

// Supabase also fires this event specifically for password-recovery links.
window.supabase.auth.onAuthStateChange((event) => {
  if (event === "PASSWORD_RECOVERY") {
    form.style.display = "block";
    msgBox.innerHTML = "";
  }
});

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const newPassword = document.getElementById("new-password").value;
  const confirmPassword = document.getElementById("confirm-password").value;

  if (newPassword !== confirmPassword) {
    showMsg("Passwords don't match.", "error");
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = "Updating...";

  try {
    const { error } = await window.supabase.auth.updateUser({ password: newPassword });
    if (error) throw error;

    // The recovery session is a real session — sign it out so the person
    // has to log in fresh with their new password, rather than silently
    // staying "logged in" via the one-time recovery token.
    await window.supabase.auth.signOut();

    document.getElementById("reset-title").textContent = "Password Updated";
    document.getElementById("reset-subtext").textContent = "";
    form.style.display = "none";
    showMsg("Your password has been changed. You can now log in with your new password.", "success");

    setTimeout(() => { window.location.href = "login.html"; }, 2500);
  } catch (err) {
    console.error("Password update error:", err);
    showMsg(err.message || "Could not update password.", "error");
    submitBtn.disabled = false;
    submitBtn.textContent = "Update Password";
  }
});
</script>

</body>
</html>
