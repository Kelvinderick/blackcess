<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile | Blackcess Airlines</title>
  <link rel="icon" type="image/png" href="./images/Untitled design.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root { --navy:#0f172a; --gold:#BA8B02; --text:#334155; --muted:#64748b; --border:#e2e8f0; }
    body { margin:0; font-family:Segoe UI,sans-serif; background:#f8fafc; color:var(--text); }
    .shell { max-width:960px; margin:0 auto; padding:32px 20px 80px; }
    .card { background:#fff; border:1px solid var(--border); border-radius:24px; padding:28px; box-shadow:0 14px 30px rgba(15,23,42,0.06); }
    form { display:grid; gap:14px; }
    label { font-weight:700; color:#1e293b; }
    input, textarea { width:100%; border:1px solid var(--border); border-radius:12px; padding:12px 14px; font:inherit; }
    textarea { min-height:120px; }
    button { border:none; border-radius:999px; padding:12px 16px; background:var(--gold); color:#fff; font-weight:700; cursor:pointer; }
    .status-target { margin-top:18px; }
  </style>
</head>
<body>
  <div class="shell">
    <div class="card">
      <h1 style="margin-top:0; color:var(--navy);">Profile settings</h1>
      <p style="color:var(--muted);">Update your contact details and save frequent traveler information for faster booking.</p>
      <form id="profile-form">
        <div>
          <label for="profile-name">Full name</label>
          <input id="profile-name" required />
        </div>
        <div>
          <label for="profile-passport">Passport number</label>
          <input id="profile-passport" required />
        </div>
        <div>
          <label for="profile-phone">Phone number</label>
          <input id="profile-phone" required />
        </div>
        <div>
          <label for="profile-saved-passengers">Saved passenger details</label>
          <textarea id="profile-saved-passengers" placeholder="Enter one passenger per line: Name | Passport | DOB"></textarea>
        </div>
        <button type="submit"><i class="fas fa-floppy-disk"></i> Save profile</button>
      </form>
      <div id="profile-status" class="status-target"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="auth-helper.js"></script>
  <script src="site-experience.js"></script>
  <script>
    const currentProfile = BlackcessDB.getCurrentProfile();
    if (!currentProfile) {
      document.getElementById('profile-status').innerHTML = '<div style="color:#f97316;">Please sign in first.</div>';
    } else {
      document.getElementById('profile-name').value = currentProfile.name || '';
      document.getElementById('profile-passport').value = currentProfile.passport || '';
      document.getElementById('profile-phone').value = currentProfile.phone || '';
      document.getElementById('profile-saved-passengers').value = Array.isArray(currentProfile.savedPassengers) ? currentProfile.savedPassengers.join('\n') : '';
    }

    document.getElementById('profile-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const form = event.currentTarget;
      const button = form.querySelector('button');
      const status = document.getElementById('profile-status');
      button.disabled = true;
      button.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Saving...';

      try {
        const savedPassengers = document.getElementById('profile-saved-passengers').value
          .split('\n').map((line) => line.trim()).filter(Boolean);

        const updated = await BlackcessDB.updateProfile({
          name: document.getElementById('profile-name').value.trim(),
          passport: document.getElementById('profile-passport').value.trim(),
          phone: document.getElementById('profile-phone').value.trim(),
          savedPassengers
        });

        BlackcessUI.renderStatus(status, {
          type: 'success',
          title: 'Profile updated',
          message: `${updated.name} is ready for faster bookings.`,
          detail: 'We also saved your passenger details for future flights.'
        });
      } catch (error) {
        BlackcessUI.renderStatus(status, {
          type: 'error',
          title: 'Profile could not be saved',
          message: error.message || 'Please sign in and try again.',
          detail: 'You can still continue to browse the site.'
        });
      } finally {
        button.disabled = false;
        button.innerHTML = '<i class="fas fa-floppy-disk"></i> Save profile';
      }
    });
  </script>
</body>
</html>
