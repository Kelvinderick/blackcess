<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flight Results | Blackcess Airlines</title>
  <link rel="icon" type="image/png" href="./images/Untitled design.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root { --navy:#0f172a; --gold:#BA8B02; --text:#334155; --muted:#64748b; --border:#e2e8f0; }
    body { margin:0; font-family:Segoe UI,sans-serif; background:#f8fafc; color:var(--text); }
    .shell { max-width:1160px; margin:0 auto; padding:24px 20px 60px; }
    .hero { background:linear-gradient(135deg,var(--navy),#1e293b); color:#fff; border-radius:24px; padding:28px 32px; margin-bottom:20px; }
    .controls { display:flex; flex-wrap:wrap; gap:10px; margin-top:16px; }
    .controls button, .controls select { border:1px solid var(--border); background:#fff; color:var(--navy); border-radius:999px; padding:10px 13px; font-weight:700; cursor:pointer; }
    .controls button.active { background:var(--gold); color:#fff; border-color:var(--gold); }
    .results { display:grid; gap:16px; margin-top:20px; }
    .card { background:#fff; border:1px solid var(--border); border-radius:20px; padding:20px; display:flex; justify-content:space-between; gap:12px; align-items:center; flex-wrap:wrap; box-shadow:0 8px 18px rgba(15,23,42,0.05); }
    .route { font-size:1.1rem; font-weight:800; color:var(--navy); margin-bottom:6px; }
    .meta { color:var(--muted); font-size:0.95rem; }
    .price { font-size:1.3rem; font-weight:800; color:var(--gold); }
    .chip { display:inline-flex; align-items:center; gap:6px; margin-right:8px; padding:6px 10px; background:#f8fafc; color:#475569; border-radius:999px; font-size:0.82rem; border:1px solid var(--border); }
    .book-btn { border:none; border-radius:999px; padding:10px 14px; background:var(--navy); color:#fff; font-weight:700; cursor:pointer; }
    .empty-state { background:#fff; padding:24px; border-radius:20px; border:1px dashed var(--border); text-align:center; color:var(--muted); }
    @media (max-width:720px){ .card{flex-direction:column; align-items:flex-start;} }
  </style>
</head>
<body>
  <div class="shell">
    <section class="hero">
      <h1>Flight results</h1>
      <p id="hero-copy">Browse the latest fares and choose a cabin that best matches your itinerary.</p>
      <div class="controls">
        <button class="active" data-filter="recommended">Recommended</button>
        <button data-filter="cheapest">Cheapest</button>
        <button data-filter="fastest">Fastest</button>
        <button data-filter="morning">Morning</button>
        <button data-filter="evening">Evening</button>
        <select id="cabin-filter">
          <option value="all">Any cabin</option>
          <option value="Economy">Economy</option>
          <option value="Premium">Premium</option>
          <option value="Business">Business</option>
        </select>
      </div>
    </section>
    <div id="results"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const origin = params.get('origin') || 'LOS';
    const destination = params.get('destination') || 'LHR';
    const departureDate = params.get('departureDate') || new Date().toISOString().slice(0,10);
    document.getElementById('hero-copy').textContent = `Showing ${origin} → ${destination} flights for ${departureDate}.`;

    const flights = [
      { id: 1, number: 'BC221', operator: 'Blackcess', origin, destination, price: 285000, duration: 255, departureHour: 7, cabin: 'Economy', stops: 'Non-stop', note: 'Best value' },
      { id: 2, number: 'BC227', operator: 'Blackcess', origin, destination, price: 320000, duration: 215, departureHour: 13, cabin: 'Premium', stops: 'Non-stop', note: 'Fastest' },
      { id: 3, number: 'BC233', operator: 'Blackcess', origin, destination, price: 410000, duration: 235, departureHour: 20, cabin: 'Business', stops: 'One stop', note: 'Comfort' },
      { id: 4, number: 'BC241', operator: 'Blackcess', origin, destination, price: 299000, duration: 275, departureHour: 6, cabin: 'Economy', stops: 'Non-stop', note: 'Early departure' },
      { id: 5, number: 'BC245', operator: 'Blackcess', origin, destination, price: 350000, duration: 240, departureHour: 18, cabin: 'Premium', stops: 'Non-stop', note: 'Evening option' },
      { id: 6, number: 'BC251', operator: 'Blackcess', origin, destination, price: 390000, duration: 260, departureHour: 22, cabin: 'Business', stops: 'Non-stop', note: 'Late departure' }
    ];

    let activeFilter = 'recommended';
    let activeCabin = 'all';

    function applyFilters() {
      let filtered = [...flights];

      if (activeFilter === 'cheapest') filtered.sort((a, b) => a.price - b.price);
      if (activeFilter === 'fastest') filtered.sort((a, b) => a.duration - b.duration);
      if (activeFilter === 'morning') filtered = filtered.filter((f) => f.departureHour < 12);
      if (activeFilter === 'evening') filtered = filtered.filter((f) => f.departureHour >= 18);

      if (activeCabin !== 'all') filtered = filtered.filter((f) => f.cabin === activeCabin);

      renderResults(filtered);
    }

    function renderResults(list) {
      const results = document.getElementById('results');
      if (!list.length) {
        results.innerHTML = '<div class="empty-state">No flights match those filters. Try another cabin or time window.</div>';
        return;
      }

      results.innerHTML = list.map((flight) => `
        <div class="card">
          <div>
            <div class="route">${flight.operator} ${flight.number} · ${flight.origin} → ${flight.destination}</div>
            <div class="meta">${flight.stops} · ${Math.floor(flight.duration / 60)}h ${flight.duration % 60}m · Depart ${flight.departureHour.toString().padStart(2, '0')}:00</div>
            <div style="margin-top:10px;">
              <span class="chip"><i class="fas fa-couch"></i> ${flight.cabin}</span>
              <span class="chip"><i class="fas fa-clock"></i> ${flight.note}</span>
            </div>
          </div>
          <div style="text-align:right;">
            <div class="price">₦${flight.price.toLocaleString()}</div>
            <div style="color:#64748b; margin:6px 0 10px;">Per traveler</div>
            <button class="book-btn" onclick="selectFlight('${flight.id}')"><i class="fas fa-arrow-right"></i> Continue</button>
          </div>
        </div>
      `).join('');
    }

    window.selectFlight = function (id) {
      const flight = flights.find((item) => item.id === Number(id));
      if (!flight) return;
      sessionStorage.setItem('blackcess-selected-flight', JSON.stringify(flight));
      window.location.href = `book.html?from=${origin}&to=${destination}`;
    };

    document.querySelectorAll('[data-filter]').forEach((button) => {
      button.addEventListener('click', () => {
        document.querySelectorAll('[data-filter]').forEach((item) => item.classList.remove('active'));
        button.classList.add('active');
        activeFilter = button.dataset.filter;
        applyFilters();
      });
    });

    document.getElementById('cabin-filter').addEventListener('change', (event) => {
      activeCabin = event.target.value;
      applyFilters();
    });

    applyFilters();
  </script>
</body>
</html>
